<!DOCTYPE html>
<html lang="en">
<head>
    <title>DevOps Health Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta http-equiv="refresh" content="10">

    <style>
        body { background-color: #0f172a; color: white; }
        .card:hover { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>

<body>

<div class="container mt-5">
    <h1 class="text-center mb-4">🚀 DevOps Health Monitor</h1>

    <div class="row g-4">

        <div class="col-md-3">
            <div class="card bg-success text-white shadow">
                <div class="card-body">
                    <h5>Status</h5>
                    <h3>🟢 {{ status }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-primary text-white shadow">
                <div class="card-body">
                    <h5>CPU Usage</h5>
                    <h3>{{ cpu }}%</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-warning text-dark shadow">
                <div class="card-body">
                    <h5>Memory</h5>
                    <h3>{{ memory }}%</h3>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card bg-info text-dark shadow">
                <div class="card-body">
                    <h5>Version</h5>
                    <h6>{{ version }}</h6>
                </div>
            </div>
        </div>

    </div>

    <div class="row g-4 mt-3">

        <div class="col-md-4">
            <div class="card bg-secondary text-white">
                <div class="card-body">
                    <h5>Server</h5>
                    <p>{{ hostname }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-secondary text-white">
                <div class="card-body">
                    <h5>System</h5>
                    <p>{{ system }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card bg-secondary text-white">
                <div class="card-body">
                    <h5>Uptime</h5>
                    <p>{{ uptime }}</p>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">
        <p>Last Updated: {{ current_time }}</p>
    </div>

</div>

</body>
</html>
