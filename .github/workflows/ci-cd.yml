name: CI/CD Pipeline

# Trigger the pipeline on every push or PR to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the repo
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Step 3: Create virtual environment & install dependencies
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run tests
    - name: Run tests
      run: |
        source venv/bin/activate
        pytest tests/

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-test  # only deploy if build & test succeed

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 1: Deploy to Azure VM using SSH
    - name: Deploy to Azure VM
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.AZURE_HOST }}        # Azure VM public IP
        username: ${{ secrets.AZURE_USER }}    # Azure VM username
        key: ${{ secrets.AZURE_KEY }}          # Private key stored in GitHub secrets
        port: 22
        script: |
          cd ~/devops-health-dashboard
          git reset --hard
          git pull origin main
          source venv/bin/activate
          pip install -r requirements.txt
          # Kill existing app process if running
          pkill -f "python app/app.py" || true
          nohup python app/app.py &
